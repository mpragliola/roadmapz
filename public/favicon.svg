<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Background -->
  <rect width="32" height="32" rx="8" fill="#0969da"/>
  <!-- Node boxes -->
  <rect x="9" y="4" width="14" height="7" rx="2" fill="white" opacity="0.95"/>
  <!-- Arrow down -->
  <line x1="16" y1="11" x2="16" y2="15" stroke="white" stroke-width="1.5" opacity="0.7"/>
  <polygon points="16,16 14,13.5 18,13.5" fill="white" opacity="0.7"/>
  <!-- Two child nodes -->
  <rect x="3" y="17" width="11" height="7" rx="2" fill="#dcfce7" opacity="0.95"/>
  <rect x="18" y="17" width="11" height="7" rx="2" fill="#dbeafe" opacity="0.95"/>
  <!-- Lines from parent to children -->
  <line x1="16" y1="11" x2="8.5" y2="17" stroke="white" stroke-width="1" opacity="0.5"/>
  <line x1="16" y1="11" x2="23.5" y2="17" stroke="white" stroke-width="1" opacity="0.5"/>
  <!-- Bottom row -->
  <rect x="9" y="26" width="14" height="4" rx="2" fill="white" opacity="0.4"/>
</svg>
